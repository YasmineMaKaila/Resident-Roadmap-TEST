<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Resident Roadmap | Cortland</title>
<meta name="description" content="The Resident Roadmap — an interactive four-page guide to the Cortland resident journey, from The Beginning through Smooth Sailing.">
<style>
:root{
  --navy:#013D7F;
  --navy-deep:#01274f;
  --magenta:#C6007E;
  --lime:#A6D04E;
  --teal:#0092BD;
  --orange:#FE7002;
  /* Interface brand tokens (exact hexes as specified) */
  --brand-navy:#002D72;
  --brand-lime:#8FAD15;
  --brand-lime-lt:#A9C23F;
  /* --chrome is measured by JS; --docw is the exact document width so the
     title/tabs above and the controls below align to the document edges. */
  --chrome:152px;
  --docw:min(1680px, calc((100dvh - var(--chrome)) * 16 / 9));
  --ink:#013D7F;
  --rule:#dde5ee;
  --shell:#eef1f5;
  --font: "TT Norms Pro","TT Norms Pro Regular","TT Norms","Avenir Next","Avenir","Nunito Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}

*{box-sizing:border-box;}

html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--shell);
  color:var(--ink);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}

.sr-only{
  position:absolute!important;
  width:1px;height:1px;
  padding:0;margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  clip-path:inset(50%);
  white-space:nowrap;border:0;
}

.skip-link{
  position:absolute;left:8px;top:-48px;z-index:200;
  background:var(--orange);color:#fff;
  padding:8px 14px;border-radius:0 0 8px 8px;
  font-weight:700;font-size:13px;text-decoration:none;
  transition:top .15s ease;
}
.skip-link:focus{top:0;}

.app{
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
  min-height:100dvh;
  padding:0 clamp(10px,2.1vw,28px);
}
.docwrap{
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:var(--docw);
  margin-top:auto;
  margin-bottom:auto;   /* auto margins centre it without clipping */
}

/* ============ Header (no banner) ============ */
.topbar{
  display:flex;
  flex-direction:column;
  padding:9px 0 0;
  background:transparent;
}
.hrow{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.brandline{display:flex;align-items:baseline;min-width:0;}
.brandline h1{
  margin:0;
  font-size:clamp(17px,2.05vw,27px);
  font-weight:400;                 /* regular, never bold */
  letter-spacing:.045em;
  text-transform:uppercase;
  color:var(--brand-navy);
  line-height:1.1;
}

.brandlabel{
  font-size:clamp(10.5px,1.02vw,13px);
  letter-spacing:.07em;
  white-space:nowrap;
  line-height:1;
  font-weight:400;
}
.brandlabel .bl-cortland{
  text-transform:uppercase;
  color:var(--brand-navy);
  font-weight:400;
}
.brandlabel .bl-dot{
  color:var(--brand-navy);
  padding:0 .45em;                 /* balanced spacing both sides */
}
.brandlabel .bl-edu{
  color:var(--brand-lime-lt);
  font-weight:400;
}

/* tabs sit directly above the document, upper right */
nav.pagenav{
  display:flex;gap:4px;flex-wrap:wrap;
  justify-content:flex-end;
  margin-top:6px;
}
.pagenav button{
  font-family:inherit;
  background:var(--brand-navy);
  border:0;
  color:#fff;
  border-radius:9px 9px 0 0;
  padding:8px clamp(10px,1.05vw,15px) 9px;
  font-size:clamp(10px,.95vw,12.5px);
  font-weight:400;                 /* regular for every inactive tab */
  cursor:pointer;
  white-space:nowrap;
  transition:background .16s ease,color .16s ease;
}
.pagenav button:hover{background:#013a8f;}
.pagenav button:focus-visible{outline:3px solid var(--orange);outline-offset:2px;}
.pagenav b{font-weight:inherit;}
.pagenav .pilltext{margin-left:6px;}
.pagenav button[aria-current="true"]{
  background:var(--brand-lime);
  color:var(--brand-navy);
  font-weight:700;                 /* only the active tab is bold */
}

/* ============ Hint strip ============ */
.hintstrip{
  min-height:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:6px 0 0;
  text-align:center;
}
.hint{
  font-size:clamp(11px,1.18vw,13.5px);
  color:#4a5c70;
  font-style:italic;
  margin:0;
  opacity:0;
  transition:opacity .25s ease;
}
.hint.show{opacity:1;}
.hint b{
  color:var(--orange);
  font-style:normal;
  font-weight:700;
}
.hint .starglyph{
  display:inline-block;
  width:.82em;height:.82em;
  vertical-align:-.06em;
  margin-right:.12em;
}

/* ============ Stage ============ */
.stagewrap{
  flex:0 0 auto;
  display:flex;
  padding:0;
  min-height:0;
}
.stage{
  position:relative;
  /* Exactly 16:9 — the artwork fills it edge to edge, so the hotspot
     percentages stay pixel-accurate. */
  width:100%;
  aspect-ratio:16/9;
  background:#fff;
  border-radius:12px;
  box-shadow:0 12px 44px rgba(1,61,127,.16);
  overflow:hidden;
  container-type:size;
  container-name:stage;
}

.page{
  position:absolute;
  inset:0;
  opacity:0;
  visibility:hidden;
  transition:opacity .32s ease;
}
.page.active{opacity:1;visibility:visible;}
.scrim{
  position:absolute;
  inset:0;
  z-index:5;
  background:rgba(255,255,255,.72);
  backdrop-filter:saturate(.55);
  -webkit-backdrop-filter:saturate(.55);
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease;
}
.stage.dimmed .page.active .scrim{opacity:1;}

.page > img.art{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}

/* ============ Hotspot stars ============ */
.star{
  position:absolute;
  z-index:10;
  transform:translate(-50%,-50%);
  padding:0;margin:0;border:0;
  background:none;
  line-height:0;
  cursor:pointer;
  pointer-events:none;      /* only the glyph itself is clickable */
  -webkit-tap-highlight-color:transparent;
}
.star svg{
  display:block;
  width:100%;height:100%;
  overflow:visible;
}
.star .halo{
  fill:var(--orange);
  opacity:0;
  transform-box:fill-box;
  transform-origin:center;
  transform:scale(.7);
  transition:opacity .18s ease,transform .18s ease;
  pointer-events:none;
}
.star .glyph{
  fill:var(--orange);
  pointer-events:auto;
  transform-box:fill-box;
  transform-origin:center;
  transition:transform .18s ease,filter .18s ease;
}
.star .hit{
  pointer-events:auto;
  transform-box:fill-box;
  transform-origin:center;
  transform:scale(1);
}
.star .ring{
  fill:none;
  stroke:var(--navy);
  stroke-width:3;
  opacity:0;
  transform-box:fill-box;
  transform-origin:center;
  transform:scale(.86);
  transition:opacity .16s ease,transform .16s ease;
  pointer-events:none;
}
.star:hover .glyph,
.star.open .glyph{
  transform:scale(1.1);
  filter:drop-shadow(0 3px 7px rgba(1,61,127,.35));
}
.star:hover .halo,
.star.open .halo{opacity:.20;transform:scale(1.32);}
.star:focus-visible{outline:none;}
.star:focus-visible .ring{opacity:1;transform:scale(1.16);}
.star:focus-visible .halo{opacity:.24;transform:scale(1.32);}
.star:focus-visible .glyph{transform:scale(1.1);}

/* ============ Info cards ============ */
.card{
  position:absolute;
  z-index:30;
  width:33cqw;
  min-width:230px;
  max-width:min(560px,92cqw);
  max-height:86cqh;
  background:#fff;
  border:3px solid var(--navy);
  border-radius:18px;
  padding:13px 16px 15px;
  box-shadow:0 16px 40px rgba(1,61,127,.26);
  opacity:0;
  transform:scale(.94);
  pointer-events:none;
  transition:opacity .17s ease,transform .17s ease;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  scrollbar-color:#b9c8d8 transparent;
}
.card.show{opacity:1;transform:scale(1);pointer-events:auto;}
.card::-webkit-scrollbar{width:8px;}
.card::-webkit-scrollbar-thumb{background:#c3d0de;border-radius:8px;}

/* Layout size classes. Which one each card uses is chosen per hotspot so the
   card lands in the clearest space beside its star. */
.card[data-cols="1"]{width:26cqw;max-width:min(430px,90cqw);}
.card[data-cols="1"] .copy{columns:1;column-rule:none;}
.card[data-cols="2"]{width:33cqw;max-width:min(560px,92cqw);}
.card[data-cols="3"]{width:44cqw;max-width:min(720px,94cqw);}

.card .copy{
  columns:2;
  column-gap:18px;
  column-rule:1px solid #e9eef4;
}
.card .copy li,
.card .copy p{break-inside:avoid;}
.card .copy > *:first-child{margin-top:0;}
@container stage (max-width:860px){
  .card{width:46cqw;max-width:96cqw;}
  .card .copy{columns:1;column-rule:none;}
}

.card h2{
  margin:0 0 8px;
  padding-right:26px;
  color:#A0CC48;
  font-size:clamp(11.5px,1.55cqw,15px);
  font-weight:800;
  line-height:1.24;
  letter-spacing:.012em;
  text-transform:uppercase;
  text-align:center;
}
.card .copy{
  font-size:clamp(10px,1.2cqw,12.4px);
  line-height:1.44;
  color:var(--navy);
}
.card .copy p{margin:0 0 .62em;}
.card .copy p:last-child{margin-bottom:0;}
.card .copy ul{margin:0 0 .62em;padding-left:1.15em;}
.card .copy ul:last-child{margin-bottom:0;}
.card .copy li{margin-bottom:.5em;}
.card .copy li:last-child{margin-bottom:0;}
.card .copy strong{font-weight:800;}
.card .copy em{font-style:italic;}
.card .copy .indent{padding-left:1.5em;display:block;}
.card .copy .midhead{
  text-align:center;
  font-weight:800;
  margin:.85em 0 .35em;
}
.card .copy .midbody{text-align:center;}

.card .close{
  position:absolute;
  top:7px;right:9px;
  width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  border:2px solid var(--navy);
  background:#fff;
  color:var(--navy);
  font-family:inherit;
  font-size:15px;line-height:1;font-weight:700;
  cursor:pointer;
  transition:background .15s ease,color .15s ease;
}
.card .close:hover{background:var(--navy);color:#fff;}
.card .close:focus-visible{outline:3px solid var(--orange);outline-offset:2px;}

/* ============ Footer controls ============ */
/* ============ Bottom controls ============ */
.bottombar{
  padding:7px 0 calc(3px + env(safe-area-inset-bottom));
  background:transparent;
  border-top:0;
}
/* nav pill centred under the document; dots + count sit to its right */
.navrow{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:0;
}
.navpill{
  grid-column:2;
  display:inline-flex;
  align-items:center;
  background:var(--brand-navy);
  border-radius:999px;
  padding:5px 8px;
  gap:2px;
}
.navhalf{
  font-family:inherit;
  display:inline-flex;
  align-items:center;
  gap:9px;
  background:none;border:0;
  color:#fff;
  font-size:clamp(12.5px,1.2vw,15px);
  font-weight:400;                     /* regular */
  letter-spacing:.015em;
  padding:7px 16px;
  border-radius:999px;
  cursor:pointer;
  white-space:nowrap;
  transition:opacity .16s ease,background .16s ease;
}
.navhalf:hover:not(:disabled){background:rgba(255,255,255,.13);}
.navhalf:focus-visible{outline:3px solid var(--brand-lime);outline-offset:2px;}
.navhalf:disabled{opacity:.34;cursor:default;}
.navhalf .arrow{font-size:1.06em;line-height:1;}

.navbadge{
  flex:none;
  width:clamp(30px,2.9vw,38px);
  height:clamp(30px,2.9vw,38px);
  border-radius:50%;
  background:var(--brand-lime);
  display:grid;place-items:center;
  margin:0 2px;
}
.navbadge svg{width:68%;height:68%;display:block;}

.navright{
  grid-column:3;
  justify-self:start;
  display:flex;
  align-items:center;
  gap:clamp(10px,1.4vw,18px);
  margin-left:clamp(12px,1.7vw,24px);
}
.dots{display:flex;gap:9px;align-items:center;}
.dots button{
  width:11px;height:11px;padding:0;
  border:0;border-radius:50%;
  background:#c6d2df;cursor:pointer;
  transition:background .16s ease,transform .16s ease;
}
.dots button:hover{background:#9fb3c6;}
.dots button[aria-current="true"]{background:var(--brand-lime);transform:scale(1.34);}
.dots button:focus-visible{outline:3px solid var(--brand-lime);outline-offset:3px;}

.counter{
  font-size:clamp(11px,1.15vw,13.5px);
  font-weight:400;                     /* regular */
  letter-spacing:.03em;
  color:var(--brand-navy);
  white-space:nowrap;
}

.pagetitle{
  text-align:center;
  font-size:clamp(10.5px,1.1vw,12.5px);
  font-weight:400;
  color:#5c6d80;
  padding:0 0 5px;
  margin:0;
}

@media (max-width:820px){
  .topbar{flex-direction:column;align-items:flex-start;gap:9px;}
  nav.pagenav{width:100%;}
  .docwrap{max-width:100%;}
  .bottombar{gap:12px;}
  .counter{order:3;width:100%;}
}

.transcripts{padding:0;}

/* Screen-reader transcript of the artwork copy. Becomes a readable panel on
   phones, where the 16:9 artwork itself is too small to read. */
.transcript{
  position:absolute!important;
  width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);clip-path:inset(50%);
  white-space:nowrap;border:0;
}

/* ---- Phone: the 16:9 stage is too short to hold a card, so the card
   becomes a bottom sheet. The roadmap and its star stay visible above it. ---- */
@media (max-width:560px){
  .pagenav{gap:8px;}
  .pagenav .pilltext{display:none;}
  .pagenav button{padding:8px 0;min-width:42px;text-align:center;}
  .brandline h1{font-size:15px;}
  .stage{container-type:normal;}
  .scrim{position:fixed;inset:0;z-index:40;}
  .card{
    position:fixed;
    left:50% !important;
    top:auto !important;
    bottom:0;
    z-index:50;
    width:min(100vw,560px) !important;
    max-width:none;
    max-height:54dvh !important;
    transform:translate(-50%,14px);
    border-radius:20px 20px 0 0;
    border-width:2px 0 0 0;
    padding:14px 18px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 34px rgba(1,61,127,.26);
  }
  .card.show{transform:translate(-50%,0);}
  .card h2{font-size:14px;padding-right:30px;}
  .card .copy{font-size:13.2px;line-height:1.46;columns:1;column-rule:none;}
  .card .close{width:30px;height:30px;font-size:19px;top:10px;right:12px;}

  /* keep control + dots + count on one row, just tighter */
  .navrow{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;}
  .navpill,.navright{grid-column:auto;}
  .navright{justify-self:auto;margin-left:0;gap:9px;}
  .navhalf{font-size:12.5px;padding:6px 11px;gap:6px;}
  .navpill{padding:4px 6px;}
  .navbadge{width:28px;height:28px;}
  .dots{gap:7px;}
  .dots button{width:9px;height:9px;}
  .counter{font-size:11.5px;}

  .star .hit{transform:scale(1.75);}      /* comfortable tap target */

  .docwrap{max-width:100%;}
  .transcripts{padding:2px 0 10px;}
  .pagetitle{display:none;}
  .bottombar{position:sticky;bottom:0;z-index:20;}
  .transcript{
    position:static!important;
    width:auto;height:auto;margin:0;padding:2px 4px 4px;
    overflow:visible;clip:auto;clip-path:none;
    white-space:normal;
  }
  .transcript[hidden]{display:none!important;}
  .transcript h2{
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:#7d8b9b;font-weight:700;margin:0 0 10px;text-align:center;
  }
  .tsec{
    border-left:4px solid var(--navy);
    padding:0 0 0 11px;margin:0 0 13px;
  }
  .tsec h3{
    margin:0 0 3px;font-size:13px;font-weight:800;
    letter-spacing:.02em;text-transform:uppercase;color:var(--navy);
  }
  .tsec p{margin:0;font-size:13px;line-height:1.45;color:#123;}
  .tsec.c-navy{border-color:var(--navy);}    .tsec.c-navy h3{color:var(--navy);}
  .tsec.c-magenta{border-color:var(--magenta);} .tsec.c-magenta h3{color:var(--magenta);}
  .tsec.c-lime{border-color:var(--lime);}    .tsec.c-lime h3{color:#7FA52E;}
  .tsec.c-teal{border-color:var(--teal);}    .tsec.c-teal h3{color:var(--teal);}
}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important;}
}

/* ============ Print ============ */
@page{size:landscape;margin:8mm;}
@media print{
  body{background:#fff;}
  .app{padding:0;display:block;}
  .docwrap{max-width:none!important;margin:0!important;display:block;}
  .topbar,.bottombar,.hintstrip,.pagetitle,.skip-link{display:none!important;}
  .app{min-height:0;}
  .stagewrap{display:block;padding:0;}
  .stage{
    max-width:100%;max-height:none;
    box-shadow:none;border-radius:0;
    aspect-ratio:auto;
    height:auto;
    container-type:normal;
  }
  .page{
    position:relative!important;
    inset:auto!important;
    opacity:1!important;
    visibility:visible!important;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100vh;
    break-after:page;
    page-break-after:always;
  }
  .page:last-child{break-after:auto;page-break-after:auto;}
  .page > img.art{
    position:static;
    width:100%;
    height:auto;
    max-height:100%;
    object-fit:contain;
  }
  .transcript,.transcripts{display:none!important;}
  .star,.card{display:none!important;}
}
</style>
</head>
<body>
<a class="skip-link" href="#stage">Skip to roadmap</a>

<div class="app">
 <div class="docwrap">

  <header class="topbar">
    <div class="hrow">
      <div class="brandline">
        <h1>The Resident Roadmap</h1>
      </div>
      <p class="brandlabel">
        <span class="bl-cortland">Cortland</span><span class="bl-dot" aria-hidden="true">&bull;</span><span class="bl-edu">Interactive Education</span>
      </p>
    </div>
    <nav class="pagenav" aria-label="Roadmap pages">
      <button type="button" data-page="0" aria-current="true" aria-label="Page 1: Full Resident Roadmap overview"><b>1</b><span class="pilltext">Full Roadmap</span></button>
      <button type="button" data-page="1" aria-label="Page 2: The Beginning, Touring, and Following Up"><b>2</b><span class="pilltext">Beginning &middot; Touring &middot; Following Up</span></button>
      <button type="button" data-page="2" aria-label="Page 3: Applying, Application Communication, and The Approval"><b>3</b><span class="pilltext">Applying &middot; Communication &middot; Approval</span></button>
      <button type="button" data-page="3" aria-label="Page 4: Get Ready to Move, Welcome Home, and Smooth Sailing"><b>4</b><span class="pilltext">Move &middot; Welcome Home &middot; Smooth Sailing</span></button>
    </nav>
  </header>

  <main class="stagewrap">
    <div class="stage" id="stage" aria-live="polite"></div>
  </main>

  <div class="hintstrip">
    <p class="hint" id="hint">
      <svg class="starglyph" viewBox="2.447 0 95.106 90.451" aria-hidden="true"><polygon fill="#FE7002" points="50,0 61.226,34.549 97.553,34.549 68.164,55.902 79.389,90.451 50,69.098 20.611,90.451 31.836,55.902 2.447,34.549 38.774,34.549"/></svg>
      Hover, focus, or tap the <b>orange stars</b> to learn more.
    </p>
  </div>

  <div class="transcripts" id="transcripts"></div>

  <footer class="bottombar">
    <div class="navrow">
      <div class="navpill">
        <button class="navhalf" id="prev" type="button" aria-label="Previous page"><span class="arrow" aria-hidden="true">&larr;</span>Previous</button>
        <span class="navbadge" aria-hidden="true">
          <svg viewBox="0 0 48 48" focusable="false">
            <path d="M24 10.5 39 23.5V37.5H9V23.5Z" fill="none" stroke="#fff" stroke-width="2.9"
                  stroke-linejoin="round" stroke-linecap="round"/>
            <path d="M24 35.6c0 0-6.2-4.1-6.2-7.9 0-1.9 1.6-3.3 3.3-3.3 1.2 0 2.4.7 2.9 1.5.5-.8 1.7-1.5 2.9-1.5 1.7 0 3.3 1.4 3.3 3.3 0 3.8-6.2 7.9-6.2 7.9z"
                  fill="#fff"/>
          </svg>
        </span>
        <button class="navhalf" id="next" type="button" aria-label="Next page">Next<span class="arrow" aria-hidden="true">&rarr;</span></button>
      </div>

/* ---------- card placement ---------- */
function place(star, card){
  var sRect = stage.getBoundingClientRect();
  var tRect = star.querySelector(".glyph").getBoundingClientRect();
  var m = 8;

  card.hidden = false;

  /* Phone bottom-sheet layout is driven entirely by CSS. */
  if(window.matchMedia("(max-width:560px)").matches){
    card.style.width = "";
    card.style.maxHeight = "";
    return;
  }

  card.style.left = "0px";
  card.style.top  = "0px";

  var sTop = tRect.top    - sRect.top;
  var sBot = tRect.bottom - sRect.top;
  var cxp  = tRect.left   - sRect.left + tRect.width/2;
  var cyp  = sTop + tRect.height/2;
  var left, top;

  if(sRect.width < 1000){
    /* Compact layout (tablet / phone): the card takes whichever side of the
       star has more room, so it can never cover the star and never clips. */
    card.style.width = Math.round(Math.min(sRect.width - 2*m, 480)) + "px";
    var gap    = Math.max(8, sRect.height * 0.022);
    var below  = sRect.height - sBot - gap - m;
    var above  = sTop - gap - m;
    var useBelow = below >= above;
    card.style.maxHeight = Math.max(96, Math.floor(useBelow ? below : above)) + "px";
    var cwC = card.offsetWidth, chC = card.offsetHeight;
    left = (sRect.width - cwC) / 2;
    top  = useBelow ? (sBot + gap) : (sTop - gap - chC);
  } else {
    card.style.width = "";        /* back to the cqw-based width */
    card.style.maxHeight = "";
    var cw = card.offsetWidth, ch = card.offsetHeight;
    var fixed = CARD_POS[card.id.replace("card-","")];

    if(fixed){
      /* Pre-computed against the artwork so the card lands in the clearest
         space beside its star. */
      left = fixed.px / 100 * sRect.width;
      top  = fixed.py / 100 * sRect.height;
    } else {
      var side = card.dataset.side || "right";
      var gapX = sRect.width * 0.014, gapY = sRect.height * 0.018;
      var halfW = tRect.width/2, halfH = tRect.height/2;
      if(side === "right"){        left = cxp + halfW + gapX;      top = cyp - ch/2; }
      else if(side === "left"){    left = cxp - halfW - gapX - cw; top = cyp - ch/2; }
      else if(side === "top"){     left = cxp - cw/2;              top = sTop - gapY - ch; }
      else {                       left = cxp - cw/2;              top = sBot + gapY; }
      left += (parseFloat(card.dataset.dx) || 0) / 100 * sRect.width;
      top  += (parseFloat(card.dataset.dy) || 0) / 100 * sRect.height;
    }

    left = Math.max(m, Math.min(left, sRect.width  - cw - m));
    top  = Math.max(m, Math.min(top,  sRect.height - ch - m));

    /* Never sit on top of its own star. */
    var sL = tRect.left - sRect.left, sR = tRect.right - sRect.left;
    if(!(left + cw < sL || left > sR || top + ch < sTop || top > sBot)){
      var gy = sRect.height * 0.02;
      if(sBot + gy + ch <= sRect.height - m)      top = sBot + gy;
      else if(sTop - gy - ch >= m)                top = sTop - gy - ch;
      else if(sR + gy + cw <= sRect.width - m)    left = sR + gy;
      else if(sL - gy - cw >= m)                  left = sL - gy - cw;
    }
  }

  card.style.left = Math.round(left) + "px";
  card.style.top  = Math.round(top)  + "px";
}

function stopTimer(){ if(hideTimer){ clearTimeout(hideTimer); hideTimer = null; } }

function show(star, card){
  if(open && open.card !== card) hide(open.star, open.card, false);
  stopTimer();
  place(star, card);
  requestAnimationFrame(function(){ card.classList.add("show"); });
  star.classList.add("open");
  star.setAttribute("aria-expanded","true");
  stage.classList.add("dimmed");
  open = {star:star, card:card};
}

function hide(star, card, refocus){
  stopTimer();
  card.classList.remove("show");
  star.classList.remove("open");
  star.setAttribute("aria-expanded","false");
  setTimeout(function(){ if(!card.classList.contains("show")) card.hidden = true; }, 200);
  if(open && open.card === card) open = null;
  if(!open) stage.classList.remove("dimmed");
  if(refocus) star.focus();
}

function toggle(star, card){
  if(card.classList.contains("show")) hide(star, card, false);
  else show(star, card);
}

function isMouse(){ return lastPointer === "mouse"; }

function wire(star, card){
  star.addEventListener("mouseenter", function(){
    if(!isMouse()) return;                 /* ignore synthetic hover from a tap */
    show(star, card);
  });
  star.addEventListener("mouseleave", function(){
    if(!isMouse()) return;
    stopTimer();
    hideTimer = setTimeout(function(){ hide(star, card, false); }, 240);
  });
  card.addEventListener("mouseenter", function(){ if(isMouse()) stopTimer(); });
  card.addEventListener("mouseleave", function(){
    if(!isMouse()) return;
    stopTimer();
    hideTimer = setTimeout(function(){ hide(star, card, false); }, 240);
  });

  star.addEventListener("click", function(e){
    e.preventDefault(); e.stopPropagation();
    /* Mouse users already opened it on hover — a click must not close it.
       Touch/pen users have no hover, so tapping toggles. */
    if(modality === "pointer" && isMouse() && card.classList.contains("show")) return;
    toggle(star, card);
  });

  star.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " " || e.key === "Spacebar"){ e.preventDefault(); toggle(star, card); }
    else if(e.key === "Escape" || e.key === "Esc"){ hide(star, card, true); }
  });
  star.addEventListener("focus", function(){
    /* Auto-open only for keyboard focus. A tap or mouse press must not
       open here, or the click that follows would immediately close it. */
    if(modality === "keyboard") show(star, card);
  });
  star.addEventListener("blur", function(){
    stopTimer();
    hideTimer = setTimeout(function(){
      if(!card.contains(document.activeElement) && !star.matches(":hover") && !card.matches(":hover")){
        hide(star, card, false);
      }
    }, 220);
  });

  card.addEventListener("keydown", function(e){
    if(e.key === "Escape" || e.key === "Esc"){ hide(star, card, true); }
  });
  card.querySelector(".close").addEventListener("click", function(e){
    e.stopPropagation(); hide(star, card, true);
  });
}

document.addEventListener("click", function(e){
  if(!open) return;
  if(!open.card.contains(e.target) && !open.star.contains(e.target)) hide(open.star, open.card, false);
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape" || e.key === "Esc"){
    if(open) hide(open.star, open.card, true);
    return;
  }
  if(open) return;
  var t = document.activeElement;
  if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
  if(e.key === "ArrowLeft"){ go(current - 1); }
  else if(e.key === "ArrowRight"){ go(current + 1); }
});

  if(!open) return;
  clearTimeout(rt);
  rt = setTimeout(function(){ if(open) place(open.star, open.card); }, 60);
});

/* ---------- navigation ---------- */
PAGES.forEach(function(p, i){
  var d = document.createElement("button");
  d.type = "button";
  d.setAttribute("aria-label","Go to page " + (i+1) + ": " + p.label);
  d.setAttribute("aria-current", i === 0 ? "true" : "false");
  d.addEventListener("click", function(){ go(i); });
  dotsWrap.appendChild(d);
});

navBtns.forEach(function(b){
  b.addEventListener("click", function(){ go(parseInt(b.dataset.page, 10)); });
});
prevBtn.addEventListener("click", function(){ go(current - 1); });
nextBtn.addEventListener("click", function(){ go(current + 1); });

function go(i){
  if(i < 0 || i >= PAGES.length || i === current) return;
  if(open) hide(open.star, open.card, false);

  var oldEl = document.getElementById("page-" + current);
  oldEl.classList.remove("active");
  oldEl.setAttribute("aria-hidden","true");

  current = i;
  var el = document.getElementById("page-" + current);
  el.classList.add("active");
  el.setAttribute("aria-hidden","false");

  prevBtn.disabled = (current === 0);
  nextBtn.disabled = (current === PAGES.length - 1);
  counter.textContent = "Page " + (current+1) + " of " + PAGES.length;
  pagelabel.textContent = PAGES[current].label;

  Array.prototype.forEach.call(dotsWrap.children, function(d, k){
    d.setAttribute("aria-current", k === current ? "true" : "false");
  });
  navBtns.forEach(function(b, k){
    b.setAttribute("aria-current", k === current ? "true" : "false");
  });

  Array.prototype.forEach.call(transcripts.children, function(tr, k){
    tr.hidden = (k !== current);
  });

  hint.classList.toggle("show", PAGES[current].stars.length > 0);
  sizeStageSettled();
}

document.getElementById("page-0").classList.add("active");
prevBtn.disabled = true;
hint.classList.remove("show");
sizeStageSettled();
window.addEventListener("load", sizeStageSettled);
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(sizeStageSettled); }

})();
</script>
</body>
</html>
